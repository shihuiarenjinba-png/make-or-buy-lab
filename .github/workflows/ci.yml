name: Make or Buy Lab checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - name: Verify static product files
        run: |
          test -f public/index.html
          test -f public/decision.js
          test -f public/app.js
          ! grep -R -E 'sk_(live|test)_[A-Za-z0-9]{15,}' --include='*.js' --include='*.html' public/ src/
