name: Make or Buy Lab checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - name: Parse delegated PowerShell
        shell: pwsh
        run: |
          $files = @('scripts/delegate_connection.ps1','scripts/init_master_env.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }
      - name: Verify static product files
        run: |
          test -f public/index.html
          test -f public/decision.js
          test -f public/app.js
          ! grep -R -E 'sk_(live|test)_[A-Za-z0-9]{15,}' --include='*.js' --include='*.html' public/ src/
