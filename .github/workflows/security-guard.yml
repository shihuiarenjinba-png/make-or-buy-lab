name: Automation security guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-guard:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Enforce automation security policy
        run: python scripts/ci/security_guard.py
