name: Automation security guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-guard:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enforce automation security policy
        run: python scripts/ci/security_guard.py
