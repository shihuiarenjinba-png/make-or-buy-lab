<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Make or Buy Lab</title><link rel="stylesheet" href="./styles.css"></head><body>
<header class="topbar"><div><strong>Make or Buy Lab</strong><span class="badge">LOCAL FIRST</span></div><span>内製 vs 外注 Relevant Cost</span></header>
<main class="layout">
<section class="panel"><h1>内製・外注判断</h1><p class="lead">配賦固定費をそのまま内製コストに足さず、実際に変化する費用とcapacityだけを比較します。定性的な供給リスクは勝手に円換算しません。</p>
<div class="grid"><label>数量<input id="quantity" type="number" min="1" value="1000"></label><label>配賦固定費（比較から除外）<input id="unavoidableAllocatedFixedCost" type="number" min="0" value="300000"></label></div></section>
<section class="panel split"><div><h2>MAKE / 内製</h2><div class="grid">
<label>材料費 / 個<input id="materialsPerUnit" type="number" min="0" value="350"></label><label>変動労務費 / 個<input id="variableLaborPerUnit" type="number" min="0" value="180"></label><label>変動製造間接費 / 個<input id="variableOverheadPerUnit" type="number" min="0" value="70"></label><label>段取費<input id="setupCost" type="number" min="0" value="30000"></label><label>回避可能固定費<input id="avoidableFixedCost" type="number" min="0" value="50000"></label><label>Step-fixed cost<input id="stepFixedCost" type="number" min="0" value="0"></label><label>品質/再作業期待費用<input id="makeQuality" type="number" min="0" value="10000"></label><label>内部物流費<input id="internalLogistics" type="number" min="0" value="10000"></label><label>既知の機会費用<input id="knownOpportunityCost" type="number" min="0" value="0"></label><label>その他Relevant Cost<input id="makeOther" type="number" min="0" value="0"></label><label>労働 必要時間<input id="laborHours" type="number" min="0" value="160"></label><label>設備 必要時間<input id="machineHours" type="number" min="0" value="100"></label>
</div></div><div><h2>BUY / 外注</h2><div class="grid">
<label>仕入単価 / 個<input id="supplierUnitPrice" type="number" min="0" value="700"></label><label>運賃<input id="freightCost" type="number" min="0" value="30000"></label><label>受入検査費<input id="inspectionCost" type="number" min="0" value="10000"></label><label>品質/再作業期待費用<input id="buyQuality" type="number" min="0" value="15000"></label><label>切替費<input id="switchingCost" type="number" min="0" value="10000"></label><label>関税等<input id="importTariff" type="number" min="0" value="0"></label><label>その他Relevant Cost<input id="buyOther" type="number" min="0" value="0"></label><label>供給信頼度 %<input id="supplierReliability" type="number" min="0" max="100" value="95"></label><label>リードタイム 日<input id="supplierLeadTime" type="number" min="0" value="14"></label><label>戦略的重要度 1-5<input id="strategicCriticality" type="number" min="1" max="5" value="3"></label><label>供給集中リスク 1-5<input id="supplierConcentration" type="number" min="1" max="5" value="2"></label>
</div></div></section>
<section class="panel"><h2>社内capacity</h2><div class="grid"><label>労働 capacity<input id="laborCapacity" type="number" min="0" value="1120"></label><label>労働 使用済み<input id="laborUsed" type="number" min="0" value="780"></label><label>設備 capacity<input id="machineCapacity" type="number" min="0" value="180"></label><label>設備 使用済み<input id="machineUsed" type="number" min="0" value="60"></label></div>
<div class="actions"><button id="evaluate">比較する</button><button id="save" class="secondary">入力を端末保存</button><button id="export" class="secondary">結果JSON</button></div><div id="decision" class="decision"></div><div id="cards" class="cards"></div>
<div class="table-wrap"><table><thead><tr><th>Resource</th><th>Before</th><th>MAKE追加</th><th>After</th><th>利用率</th><th>判定</th></tr></thead><tbody id="resources"></tbody></table></div><div id="risk" class="risk"></div><details><summary>計算上の仮定</summary><ul id="assumptions"></ul></details></section>
</main><script type="module" src="./app.js"></script></body></html>
